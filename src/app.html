<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#10151e" />
		<!-- periodicity:bootstrap -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="initial-view-loading">
			<p id="initial-view-pending" role="status">Loading your view…</p>
			<section id="initial-view-failed" role="alert" aria-labelledby="initial-view-error-heading">
				<h1 id="initial-view-error-heading">Your view could not be loaded</h1>
				<p>Check your connection and retry. Your link and requested view have been kept.</p>
				<button type="button" class="button button-primary" data-retry-initial-view>
					Retry loading
				</button>
				<a class="button" href="?" data-sveltekit-reload>Open default view</a>
			</section>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
